# Ghostty から移行。Ghostty のタブは macOS ネイティブタブで、タブ 1 枚ずつが別ウィンドウになり、ウィンドウマネージャと相性が悪かった

font_family JetBrainsMono Nerd Font Mono
disable_ligatures always
# 同じ 13pt でも Ghostty より小さく見えるので一回り上げる
font_size 14
# 既定 (platform) は明るい文字を太く濃く合成し、Ghostty より白が強く見える
text_composition_strategy legacy

include theme.conf
# 画像は Ghostty と共有する。tint で背景色と混ぜて暗くし、文字のコントラストを確保する
background_image ~/.config/ghostty/bg.jpg
background_image_layout cscaled
background_tint 0.95

hide_window_decorations titlebar-only
tab_bar_edge top
# タブが 1 枚のプロジェクトでもタブバーを出し、どのプロジェクトにいるかを常に見えるようにする
tab_bar_min_tabs 1
tab_bar_style powerline
tab_title_template "{index}: {title}"
active_tab_title_template "{session_name} {index}: {title}"
# プログラムが付けるタイトルは長く、タブの境目が埋もれるので切り詰める
tab_title_max_length 32
# テーマは active と inactive の背景が同色で見分けにくいので、active だけ Kanagawa の青で塗る
active_tab_foreground #0d0c0c
active_tab_background #8ba4b0
active_tab_font_style bold
inactive_tab_foreground #737c73
inactive_tab_background #282727
inactive_tab_font_style normal

# 分割したときにフォーカス中の pane が分かりにくいので、それ以外の文字を薄くする
inactive_text_alpha 0.6
# JankyBorders のウィンドウ枠 (青) と区別できるよう、pane の枠は Kanagawa の緑にする
window_border_width 2pt
active_border_color #87a987
inactive_border_color #282727

macos_option_as_alt yes
# prefix の後に割り当ての無いキーを押すたびに鳴ってうるさい
enable_audio_bell no

# zellij をやめ、プロジェクトは kitty のセッション、api/web はタブ、pane は分割で扱う
# タブバーには今のプロジェクトのタブだけを出し、zellij のセッション内タブと同じ見え方にする
tab_bar_filter session:~ or session:^$
# 起動時のタブがどのセッションにも属さず、session:^$ の条件で全セッションのタブバーに出続けるので、scratch に属させる
startup_session scratch.kitty-session
enabled_layouts splits,stack

map ctrl+shift+[ previous_tab
map ctrl+shift+] next_tab
map ctrl+shift+, move_tab_backward
map ctrl+shift+. move_tab_forward
# --cwd=current にすると今のプロジェクトのセッションに属し、タブバーから消えない
map cmd+t launch --type=tab --location=last --cwd=current
# Ghostty と同じく番号でタブへ飛ぶ。kitty の既定には無い
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab -1
map shift+enter send_text all \x1b\r
# 分割は prefix + % / " に揃え、kitty 既定の分割キーは誤爆するので潰す
map cmd+enter no_op
map ctrl+shift+enter no_op

# zellij と同じ Ctrl j を prefix にする。zellij の normal モードはほぼ 1 操作で locked に戻るので、モードではなくキーの連続で再現する
map ctrl+j>h previous_window
map ctrl+j>l next_window
map ctrl+j>j neighboring_window down
map ctrl+j>k neighboring_window up
map ctrl+j>; nth_window -1
# 以下は tmux の既定に揃える (zellij も tmux に寄せていたため)
map ctrl+j>q focus_visible_window
map ctrl+j>o next_window
map ctrl+j>p previous_tab
map ctrl+j>shift+7 close_tab
map ctrl+j>shift+1 detach_window new-tab
map ctrl+j>shift+[ move_window_backward
map ctrl+j>shift+] move_window_forward
map ctrl+j>shift+5 launch --location=vsplit --cwd=current
map ctrl+j>shift+' launch --location=hsplit --cwd=current
map ctrl+j>z toggle_layout stack
map ctrl+j>x close_window
map ctrl+j>c launch --type=tab --location=last --cwd=current
map ctrl+j>n next_tab
map ctrl+j>, set_tab_title
map ctrl+j>1 goto_tab 1
map ctrl+j>2 goto_tab 2
map ctrl+j>3 goto_tab 3
map ctrl+j>4 goto_tab 4
map ctrl+j>5 goto_tab 5
map ctrl+j>6 goto_tab 6
map ctrl+j>7 goto_tab 7
map ctrl+j>8 goto_tab 8
map ctrl+j>9 goto_tab 9
map ctrl+j>[ show_scrollback
# プロジェクトの一覧は kitty 標準の chooser を使う。既定の最近使った順では番号が毎回変わり、手で覚えられない
map ctrl+j>s goto_session --sort-by=alphabetical ~/.local/share/kitty-sessions
# 標準の一覧は開いているかを区別しないので、開いているものだけの一覧を別に用意する (tmux の prefix w と同じ発想)
map ctrl+j>w goto_session --sort-by=alphabetical --active-only
map ctrl+j>tab goto_session -1
map ctrl+j>shift+j launch --type=overlay /bin/zsh -c journal
map ctrl+j>shift+p launch --type=overlay --cwd=current /bin/zsh -c prompt-note
map ctrl+j>r start_resizing_window
# pane の移動は連続で押したいので、ここだけ zellij の move モードと同じくモードにする
map --new-mode move --on-unknown end ctrl+j>m
map --mode move h move_window left
map --mode move j move_window down
map --mode move k move_window up
map --mode move l move_window right
map --mode move esc pop_keyboard_mode
map --mode move enter pop_keyboard_mode
