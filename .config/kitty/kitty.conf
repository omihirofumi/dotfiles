# Ghostty から移行。Ghostty のタブは macOS ネイティブタブで、AeroSpace が 1 枚ずつ別ウィンドウとして扱い
# フォーカスが別タブへ飛ぶ。kitty のタブはウィンドウ内に自前で描くので AeroSpace からは 1 枚に見える

font_family JetBrainsMono Nerd Font Mono
disable_ligatures always
# 同じ 13pt でも Ghostty より小さく見えるので一回り上げる
font_size 14
# 既定 (platform) は明るい文字を太く濃く合成し、Ghostty より白が強く見える
text_composition_strategy legacy

include theme.conf
# 画像は Ghostty と共有する。tint で背景色と混ぜて暗くし、文字のコントラストを確保する
background_image ~/.config/ghostty/bg.jpg
background_image_layout cscaled
background_tint 0.95

hide_window_decorations titlebar-only
tab_bar_edge top
tab_bar_style powerline
tab_title_template "{index}: {title}"

macos_option_as_alt yes

# 新しいタブ/ウィンドウでプロジェクトを選び、その zellij セッションに入る
# kitty は shell の ~ を展開しないので、.zshenv で ~/.local/bin を PATH に入れる zsh 経由で起動する
shell /bin/zsh -c zj-open

map ctrl+shift+[ previous_tab
map ctrl+shift+] next_tab
map ctrl+shift+, move_tab_backward
map ctrl+shift+. move_tab_forward
map cmd+t launch --type=tab --location=last
# Ghostty と同じく番号でタブへ飛ぶ。kitty の既定には無い
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab -1
map shift+enter send_text all \x1b\r
# 分割は zellij で行うので、kitty 自身の分割ウィンドウは作らせない
map cmd+enter no_op
map ctrl+shift+enter no_op
