# 公式 default-config.toml をベースに、使うものだけ残している
# https://nikitabobko.github.io/AeroSpace/guide
config-version = 2

start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Ghostty のネイティブタブは別ウィンドウ扱いになり、ずらすと macOS のタブ配置と取り合ってガタつく
accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

persistent-workspaces = ["1", "2", "3", "4", "5"]

key-mapping.preset = 'qwerty'

# borders の枠はウィンドウの外側に描かれ、0 だと画面外や隣のウィンドウの下に隠れるので枠が見える程度に空ける
gaps.inner.horizontal = 3
gaps.inner.vertical = 3
gaps.outer.left = 3
gaps.outer.bottom = 3
gaps.outer.top = 3
# 49インチでは右 1/3 (5120 / 3) を空けてサブ領域にする。ノートやモバイルモニターには効かせたくないので枠用の隙間だけにフォールバック
gaps.outer.right = [{ monitor.'LG HDR DQHD' = 1707 }, 3]

# alt 単体は zellij の Alt h/j/k/l、ctrl-alt は Magnet が使っているため、alt-shift を主修飾キーにする
[mode.main.binding]
alt-shift-slash = 'layout tiles horizontal vertical'
alt-shift-comma = 'layout accordion horizontal vertical'
alt-shift-f = 'layout floating tiling'
# gaps の外にはタイルで置けないので、floating にしてから自前で右 1/3 に寄せる
alt-shift-r = ['layout floating', 'exec-and-forget ~/.local/bin/win-right-third']

# floating を含めるとタイル間の移動中に右 1/3 のサブへ飛ぶので、サブへは alt-shift-o で行く
alt-shift-h = 'focus --ignore-floating left'
alt-shift-j = 'focus --ignore-floating down'
alt-shift-k = 'focus --ignore-floating up'
alt-shift-l = 'focus --ignore-floating right'
alt-shift-o = 'exec-and-forget ~/.local/bin/aerospace-sub-toggle'

ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

alt-shift-1 = 'workspace 1'
alt-shift-2 = 'workspace 2'
alt-shift-3 = 'workspace 3'
alt-shift-4 = 'workspace 4'
alt-shift-5 = 'workspace 5'

ctrl-alt-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-shift-5 = 'move-node-to-workspace 5'

alt-shift-tab = 'workspace-back-and-forth'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# メインのタイルは作業用の4つだけにし、それ以外は右 1/3 のサブに逃がす
# 除外リストではなく許可リストにしているのは、新しく入れたアプリがメインを割らないようにするため
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'layout tiling'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'layout tiling'

[[on-window-detected]]
if.app-id = 'com.jetbrains.intellij'
run = 'layout tiling'

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = 'layout tiling'

[[on-window-detected]]
if = 'true'
run = ['layout floating', 'exec-and-forget ~/.local/bin/win-right-third']
