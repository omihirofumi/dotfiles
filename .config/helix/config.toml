theme = "ao_transparent"


[editor]
scrolloff = 5
line-number = "relative"
bufferline = "always"
clipboard-provider = "pasteboard"
jump-label-alphabet = "fjdkslarueiwoqpvncmxz"
trim-trailing-whitespace = true
color-modes = true
rainbow-brackets = true
# zellij はペインからの kitty keyboard protocol 問い合わせに応答せず、Helix が無効と判定して Ctrl-I が Tab と同一視されるため強制有効化する
kitty-keyboard-protocol = "enabled"

[editor.statusline]
left = ["mode"]
center = ["file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-indent-style", "position-percentage", "total-line-numbers", "file-type"]
mode.normal = "NORMAL"
mode.select = "SELECT"
mode.insert = "INSERT"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "block"

[editor.soft-wrap]
enable = true

[editor.indent-guides]
render = true

[editor.file-picker]
hidden = false
git-ignore = false

[editor.lsp]
snippets = false

[keys.insert]
"C-[" = "normal_mode"
"C-m" = "insert_newline"
"C-space" = "completion"
"C-e" = "goto_line_end"
"C-b" = "move_char_left"
"C-f" = "move_char_right"
"C-t" = ["indent"]
"C-d" = ["unindent"]
"C-c" = ["toggle_comments"]
"C-o" = ["normal_mode", "open_below"]

[keys.normal]
# Start yazi at the current buffer's file (falls back to cwd for scratch buffers)
# yazi は Helix の alt screen の中で起動せず、Helix 自身の restore/claim と同じ順序で
# kitty keyboard を pop して alt screen を抜けてから起動する。zellij 0.45 はネストした
# ?1049h で現在の kitty 状態を main 画面側に保存してしまい、Helix を抜けた後の
# シェルに CSI u が流れ続けるため。
"C-y" = [
  ':sh rm -f /tmp/unique-file',
  ':sh printf "\x1b[<u\x1b[?1049l" > /dev/tty',
  ':insert-output yazi %sh{f="%{buffer_name}"; [ -e "$f" ] && echo "$f" || echo .} --chooser-file=/tmp/unique-file',
  ':sh printf "\x1b[?1049h\x1b[?2004h\x1b[>5u" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]
C-e = "scroll_down"
D   = "kill_to_line_end"
x = "extend_line_below"
X = "extend_line_above"
"tab" = "flip_selections"
# Overrides the default `q` (replay_macro) to use it as a prefix key
q.q = ":quit!"
"C-u" = ["page_cursor_half_up", "align_view_center"]
"C-k" = ["page_cursor_half_up", "align_view_center"]
"C-d" = ["page_cursor_half_down", "align_view_center"]
"C-j" = ["page_cursor_half_down", "align_view_center"]
space.g.f = ":sh gh browse \"%{buffer_name}\""
space.g.s = ":sh gh browse \"%{buffer_name}:%{selection_line_start}-%{selection_line_end}\""
space.g.c = ":sh echo \"%{buffer_name}:%{selection_line_start}-%{selection_line_end}\" | pbcopy"
space.x = ":pipe-to python3 -c 'import subprocess, sys, urllib.parse; subprocess.run([\"open\", \"naniapp://translate?source=\" + urllib.parse.quote(sys.stdin.read())])'"

[keys.normal."]"]
"]" = "goto_next_buffer"

[keys.normal."["]
"[" = "goto_previous_buffer"

[keys.select]
space.g.f = ":sh gh browse \"%{buffer_name}\""
space.g.s = ":sh gh browse \"%{buffer_name}:%{selection_line_start}-%{selection_line_end}\""
space.g.c = ":sh echo \"%{buffer_name}:%{selection_line_start}-%{selection_line_end}\" | pbcopy"
space.x= ":pipe-to python3 -c 'import subprocess, sys, urllib.parse; subprocess.run([\"open\", \"naniapp://translate?source=\" + urllib.parse.quote(sys.stdin.read())])'"
