#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
email = "99390907+omihirofumi@users.noreply.github.com"
name = "omihirofumi"

[ui]
merge-editor = ":builtin"
default-command = "log"
# hunk は git 形式の diff を解析して描画するため、diff-formatter も :git に合わせる。
# difftastic で見たいときは `jj diff --tool difft`
pager = ["hunk", "pager"]
diff-formatter = ":git"

[colors]
change_id = "#ff1525"

[aliases]
aicommit = ["util", "exec", "--", "codex", "--dangerously-bypass-approvals-and-sandbox", "exec", "Review the diff, then commit and use `jj commit -m 'message'`. Follow conventional commits. Do nothing else."]
pull = ["util", "exec", "--", "sh", "-c", "jj git fetch -b \"$1\" && jj new \"$1@origin\"", "--"]

# https://x.com/mitchellh/status/2051337285418029140?s=20
tug = ["bookmark", "advance", "--to", "@-"]

[remotes.origin]
auto-track-created-bookmarks = "*"
